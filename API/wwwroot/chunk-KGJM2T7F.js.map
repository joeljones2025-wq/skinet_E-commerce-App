<div>
    <h3 class="text-3xl text-center pt-6 mb-3">Filters</h3>
    <mat-divider></mat-divider>

    <div class="flex p-4">
        <div class="w-1/2">
            <h4 class="font-semibold text-xl text-primary">Brands</h4>
            <mat-selection-list [(ngModel)]="selectedBrand" [multiple]="true">
                @for (brand of shopService.productBrands; track $index) {
                    <mat-list-option [value]="brand">{{brand}}</mat-list-option>
                }
            </mat-selection-list>
        </div>

        <div class="w-1/2">
            <h4 class="font-semibold text-xl text-primary">Types</h4>
            <mat-selection-list [(ngModel)]="selectedType" [multiple]="true">
                @for (type of shopService.productTypes; track $index) {
                    <mat-list-option [value]="type">{{type}}</mat-list-option>
                }
            </mat-selection-list>
        </div>
    </div>
     <div class="flex justify-end p-4">
        <button mat-flat-button (click)="applyFilter()">Apply Filters</button>
    </div>
</div>
