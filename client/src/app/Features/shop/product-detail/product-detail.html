@if (product(); as product) {
  <section class="py-8">
    <div class="max-w-6xl px-4 mx-auto">
      <div class="grid grid-cols-1 items-start gap-8 md:grid-cols-[minmax(0,450px)_minmax(0,1fr)] md:gap-20">
        <div class="w-full">
          <img
            class="aspect-square w-full object-cover"
            [src]="product.pictureUrl"
            [alt]="product.name"
          />
        </div>

        <div class="mt-2 md:mt-0">
          <h1 class="text-xl font-bold text-gray-900">
            {{ product.name }}
          </h1>

          <div class="mt-2">
            <p class="text-2xl font-extrabold text-gray-900">
              {{ product.price | currency }}
            </p>
          </div>

          <div class="mt-4 flex flex-wrap items-start gap-3">
            <button
              (click)="updateCart()"
              mat-flat-button
              [disabled]="updatingCart || quantity === quantityInCart || !isValidQuantity()"
              class="!h-11 !bg-violet-600 !px-4 !text-white"
            >
              <mat-icon>shopping_cart</mat-icon>
              {{ getButtonText() }}
            </button>

            <mat-form-field appearance="outline" class="w-40" subscriptSizing="dynamic">
              <mat-label>Quantity</mat-label>
              <input
                matInput
                min="1"
                step="1"
                type="number"
                [disabled]="updatingCart"
                [(ngModel)]="quantity"
              />
            </mat-form-field>
          </div>

          <mat-divider class="!my-4"></mat-divider>

          <p class="text-sm leading-6 text-gray-500">
            {{ product.description }}
          </p>
        </div>
      </div>
    </div>
  </section>
} @else if (loading()) {
  <div class="py-10 text-center text-gray-500">Loading product...</div>
} @else if (loadError()) {
  <div class="py-10 text-center text-red-500">{{ loadError() }}</div>
}
